[project]
name = "data-proc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "requests>=2.32.5"
]

[tool.uv.sources]
data = { git = "https://github.com/BMLN/data.git" }
inference = { git = "https://github.com/bmln/inference" }

[dependency-groups]
text-generate = [
    "inference"
]
kb-generate = [
    "accelerate>=1.12.0",
    "data>=0.1.0",
    "torch>=2.9.1",
    "transformers>=4.57.3",
]
kb-load = [
    "data",
    "weaviate-client>=4.19.2",
]
