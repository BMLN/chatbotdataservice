[project]
name = "data-proc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[tool.uv.sources]
data = { git = "https://github.com/BMLN/data.git" }
inference = { git = "https://github.com/bmln/inference" }
jira = { git = "https://github.com/bmln/jira.git" }
chatbot = { git = "https://github.com/BMLN/chatterbot.git" }

[tool.uv.build-backend]
module-root = "src"

[tool.uv_build]
packages = [
    { include = "data", from = "src" },
    { include = "performance", from = "src" }
]

[dependency-groups]
text-fetch = [
    "jira",
    "requests>=2.32.5",
]
text-generate = [
    "inference",
    "pandas>=2.3.3",
]
kb-generate = [
    "chatbot",
    "data>=0.1.0",
]
kb-load = [
    "data",
    "weaviate-client>=4.19.2",
]
service = [
    "flask>=3.1.2",
    "gunicorn>=23.0.0",
]
pdf-process = [
    "aspose-pdf>=25.12.0",
    "inference>=0.0.1",
    "langchain-text-splitters>=1.1.0",
    "levenshtein>=0.27.3",
    "pandas>=2.3.3",
    "pymupdf>=1.26.7",
]
