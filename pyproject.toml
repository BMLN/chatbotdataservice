[project]
name = "data-proc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[tool.uv.sources]
data = { git = "https://github.com/BMLN/data.git" }
inference = { git = "https://github.com/bmln/inference" }
jira = { git = "https://github.com/bmln/jira.git" }
chatbot = { git = "https://github.com/BMLN/chatterbot.git" }

[dependency-groups]
text-fetch = [
    "jira",
    "requests>=2.32.5",
]
text-generate = [
    "inference",
    "pandas>=2.3.3",
]
kb-generate = [
    "chatbot",
    "data>=0.1.0",
]
kb-load = [
    "data",
    "weaviate-client>=4.19.2",
]
service = [
    "flask>=3.1.2",
    "gunicorn>=23.0.0",
]
